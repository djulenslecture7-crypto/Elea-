name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Cordova
        run: npm install -g cordova

      - name: Create Cordova project
        run: |
          cordova create app com.djulens.cryptolecture Eléa
          rm -rf app/www/*
          cp -r www/* app/www/

      - name: Set app icon
        run: |
          mkdir -p app/res/icon/android
          cp assets/icon.png app/res/icon/android/icon-ldpi.png
          cp assets/icon.png app/res/icon/android/icon-mdpi.png
          cp assets/icon.png app/res/icon/android/icon-hdpi.png
          cp assets/icon.png app/res/icon/android/icon-xhdpi.png
          cp assets/icon.png app/res/icon/android/icon-xxhdpi.png
          cp assets/icon.png app/res/icon/android/icon-xxxhdpi.png

      - name: Update config.xml with icon
        working-directory: app
        run: |
          python3 - <<'EOF'
          import re

          with open("config.xml", "r", encoding="utf-8") as f:
              content = f.read()

          icon_block = '''
              <platform name="android">
                  <icon density="ldpi" src="res/icon/android/icon-ldpi.png" />
                  <icon density="mdpi" src="res/icon/android/icon-mdpi.png" />
                  <icon density="hdpi" src="res/icon/android/icon-hdpi.png" />
                  <icon density="xhdpi" src="res/icon/android/icon-xhdpi.png" />
                  <icon density="xxhdpi" src="res/icon/android/icon-xxhdpi.png" />
                  <icon density="xxxhdpi" src="res/icon/android/icon-xxxhdpi.png" />
              </platform>
          '''

          if "<platform name=\"android\">" not in content:
              content = content.replace("</widget>", icon_block + "</widget>")

          with open("config.xml", "w", encoding="utf-8") as f:
              f.write(content)
          EOF

      - name: Add Android platform
        working-directory: app
        run: cordova platform add android

      - name: Build APK
        working-directory: app
        run: cordova build android

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
